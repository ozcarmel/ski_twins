name: Browser review
on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - 'assets/**'
      - 'resorts/**'
      - 'sitemap.xml'
      - 'package*.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/browser-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ski-twins-browser-review
          path: browser-review/
          retention-days: 14
